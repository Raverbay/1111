<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — Flip&Co</title><link rel="stylesheet" href="styles.css?v=31"></head><body><div id="siteHeader"></div><main class="checkout wrap"><div class="section-line"><span>01 / CHECKOUT</span><span>ORDER REQUEST</span></div><h1>Completa<br><i>la richiesta.</i></h1><div class="checkout-grid"><form id="checkoutForm" class="form"><label>DATI CLIENTE</label><input name="name" required placeholder="Nome e cognome"><input name="email" type="email" required placeholder="Email"><input name="phone" placeholder="Telefono"><label>INDIRIZZO</label><input name="address" required placeholder="Indirizzo"><div class="two"><input name="city" required placeholder="Città"><input name="zip" required placeholder="CAP"></div><button class="button dark full" type="submit">INVIA RICHIESTA <span>↗</span></button><p class="form-note">Il checkout è predisposto per il attivazione. Il pagamento online verrà collegato al provider scelto da Flip&Co.</p></form><aside class="order-summary"><div class="section-line"><span>YOUR BAG</span><span>ORDER</span></div><div id="checkoutItems"></div><div class="summary-total"><span>TOTALE</span><strong id="checkoutTotal">€ 0,00</strong></div></aside></div></main><div id="siteFooter"></div><div id="cartRoot"></div><script src="js/data.js"></script><script src="js/commerce.js"></script><script src="js/site.js"></script><script src="js/checkout.js"></script></body></html>
